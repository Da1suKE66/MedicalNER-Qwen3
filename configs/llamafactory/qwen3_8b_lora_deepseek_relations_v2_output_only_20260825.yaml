### Output-only SFT with the frozen relations.csv active schema.
### The dataset builder compacts JSON, removes property/deleted relations, and
### duplicates relation-bearing training rows once to counter token imbalance.
# ModelScope snapshot path on the pinned lsh-temp31030 node.
model_name_or_path: /cache/liluchen/model_cache/models/Qwen--Qwen3-8B/snapshots/master
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

dataset_dir: /cache/liluchen/medicalner_relations_v2/data
dataset: medicalner_relations_v2_train
eval_dataset: medicalner_relations_v2_dev
template: qwen3
enable_thinking: false
train_on_prompt: false
cutoff_len: 16384
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 2
val_size: 0

output_dir: /cache/liluchen/medicalner_relations_v2/output/lora_output_only_20260825
logging_steps: 1
save_strategy: steps
save_steps: 50
save_total_limit: 12
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none
logging_dir: /cache/liluchen/medicalner_relations_v2/output/lora_output_only_20260825/runs
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
ddp_timeout: 180000000
flash_attn: auto
gradient_checkpointing: true

per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50
